name: Manual Docker image publishing

on:
  workflow_dispatch:
    inputs:
      image:
        description: "选择要构建的镜像"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - crawler
          - mcp
      source_tag:
        description: "可选，构建已有的 v* 或 mcp-v* 标签。留空使用本次派发选择的版本。"
        type: string
        required: false

env:
  REGISTRY: docker.io

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_tag && format('refs/tags/{0}', inputs.source_tag) || github.sha }}
          persist-credentials: false
      - name: Resolve release source
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.source_tag }}
          EVENT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$EVENT_TAG}"
          if [[ -n "$tag" ]]; then
            git check-ref-format "refs/tags/$tag"
            case "$tag" in v*|mcp-v*) ;; *) echo 'Unsupported release tag' >&2; exit 1 ;; esac
          fi
          printf 'sha=%s\ntag=%s\n' "$(git rev-parse --verify 'HEAD^{commit}')" "$tag" >> "$GITHUB_OUTPUT"

  build-crawler:
    needs: source
    runs-on: ubuntu-latest
    if: inputs.image == 'all' || inputs.image == 'crawler'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: wantcat/trendradar
          tags: |
            type=semver,pattern={{version}},value=${{ needs.source.outputs.tag }},enable=${{ startsWith(needs.source.outputs.tag, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.source.outputs.tag }},enable=${{ startsWith(needs.source.outputs.tag, 'v') }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-mcp:
    needs: source
    runs-on: ubuntu-latest
    if: inputs.image == 'all' || inputs.image == 'mcp'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        env:
          SOURCE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          if [[ "$SOURCE_TAG" == mcp-v* ]]; then
            VERSION="${SOURCE_TAG#mcp-v}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "major_minor=$(echo $VERSION | cut -d. -f1,2)" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "major_minor=latest" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: wantcat/trendradar-mcp
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./docker/Dockerfile.mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
